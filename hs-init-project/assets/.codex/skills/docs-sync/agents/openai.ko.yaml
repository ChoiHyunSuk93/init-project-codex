interface:
  display_name: "Docs Sync"
  short_description: "현재 상태 문서 동기화를 위한 starter local skill"
  default_prompt: "코드나 규칙 변경과 함께 README, guide, rule, roadmap 같은 현재 상태 문서를 맞춰야 하면 $docs-sync를 사용한다. 기존 implementation briefing은 과거 이력으로 보존하고 동기화 대상으로 탐색하지 않는다."
policy:
  allow_implicit_invocation: true
