name: Validate Skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check "pyyaml>=6,<7"

      - name: Validate skill and generated scaffold
        run: python3 hs-init-project/scripts/validate_scaffold.py
